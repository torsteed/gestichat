<header class="header">
  <a href="/" class="logo">Gestichat</a>
  
  <nav>
    <ul class="nav-menu">
      <li><a href="/">Accueil</a></li>
      <li>
        <a href="javascript:void(0)" class="dropdown-toggle" data-bs-toggle="dropdown">
          Repas <i class="fas fa-chevron-down"></i>
        </a>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="/repas">Liste des repas</a></li>
          <li><a class="dropdown-item" href="/repas/nouveau">Nouveau repas avancé</a></li>
        </ul>
      </li>
      <li><a href="/cats">Chats</a></li>
      <li><a href="/humains">Humains</a></li>
      <li><a href="/stock">Stock</a></li>
      <li><a href="/api">API</a></li>
    </ul>
  </nav>
  
  <div class="user-selector">
    <select 
      (change)="onUserSelected($event)" 
      [disabled]="isLoading"
      [ngModel]="selectedUser?.id || ''"
    >
      <option value="">Choisir un utilisateur</option>
      <option *ngFor="let user of users" [value]="user.id">{{ user.name }}</option>
    </select>
  </div>
</header>

<!-- Dropdown menu styles -->
<style>
  .dropdown-menu {
    position: absolute;
    display: none;
    min-width: 12rem;
    padding: 0.5rem 0;
    margin: 0.125rem 0 0;
    font-size: 1rem;
    color: #212529;
    text-align: left;
    list-style: none;
    background-color: #fff;
    background-clip: padding-box;
    border: 1px solid rgba(0, 0, 0, 0.15);
    border-radius: 0.375rem;
    z-index: 1000;
  }
  
  .dropdown-menu.show {
    display: block;
  }
  
  .dropdown-item {
    display: block;
    width: 100%;
    padding: 0.25rem 1rem;
    clear: both;
    font-weight: 400;
    color: #212529;
    text-align: inherit;
    text-decoration: none;
    white-space: nowrap;
    background-color: transparent;
    border: 0;
    cursor: pointer;
  }
  
  .dropdown-item:hover, .dropdown-item:focus {
    color: #1a1e21;
    text-decoration: none;
    background-color: #f8f9fa;
  }
  
  .dropdown-toggle::after {
    display: none;
  }
</style>
